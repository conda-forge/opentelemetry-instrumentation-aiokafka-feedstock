schema_version: 1

context:
  version: "0.66b1"

package:
  name: opentelemetry-instrumentation-aiokafka
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/opentelemetry-instrumentation-aiokafka/opentelemetry_instrumentation_aiokafka-${{ version }}.tar.gz
  sha256: 185e18196d52f13db75910bc5fa1900ff858dc3743c473e6bf4d57c712125448

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - opentelemetry-api >=1.27,<2.dev0
    - opentelemetry-instrumentation ==${{ version }}
    - opentelemetry-semantic-conventions ==${{ version }}
    - typing_extensions >=4.1,<5.dev0
    - aiokafka >=0.8,<1.0

tests:
  - python:
      imports:
        - opentelemetry
        - opentelemetry.instrumentation.aiokafka
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: OpenTelemetry aiokafka instrumentation
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/open-telemetry/opentelemetry-python-contrib/tree/main/instrumentation/opentelemetry-instrumentation-aiokafka

extra:
  recipe-maintainers:
    - BrownMunda1
